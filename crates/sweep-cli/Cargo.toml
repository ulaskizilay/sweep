[package]
name = "sweep"
description = "Terminal cleanup and maintenance for Arch Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Distributed as a PKGBUILD and from git, never from crates.io.
publish = false

[[bin]]
name = "sweep"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
crossterm = "0.29.0"
libc.workspace = true
ratatui = "0.30"
serde = { workspace = true }
serde_json.workspace = true
sweep-core = { path = "../sweep-core" }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
