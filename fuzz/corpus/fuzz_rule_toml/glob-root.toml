# A glob root is accepted by the compiler, so every accessor the fuzz target
# walks has to answer it. `Rule::expanded_root` used to call the literal-only
# `Template::expand`, whose `debug_assert` fires on a pattern.
[[rule]]
id = "dev.example.versioned"
section = "dev-tools"
kind = "dir-age"
root = "{cache}/Google/AndroidStudio*"
evidence = "regenerated by the tool"
recoverable = true
keep_days = 30
privilege = "user"
