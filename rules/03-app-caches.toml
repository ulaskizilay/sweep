[[rule]]
id = "app.slack.code-cache"
section = "app-caches"
kind = "dir-sweep"
root = "{config}/Slack/Code Cache"
evidence = "Renderer bytecode cache, rebuilt on the next launch."
recoverable = true
keep_days = 0
requires = ["dir:{config}/Slack"]
privilege = "user"

# Spotify keeps everything under the cache base rather than under ~/.config:
# the Chromium sub-caches, the shader caches, the TTS and DRM components - and
# two trees that are not caches at all.
#
#   Data/     the audio chunks, which is where an offline download lives. The
#             user asked for those to be available without a network; deleting
#             them is a data-plan cost, not a rebuild.
#   Users/    per-user state: playback settings, the queue, restrictions.
#
# Both are excluded, together with the Chromium storage directories the rest of
# this section never touches. What is left is about 400 MiB of regenerable
# cache on a machine where the directory is 2.2 GiB.
[[rule]]
id = "app.spotify.cache"
section = "app-caches"
kind = "dir-sweep"
root = "{cache}/spotify"
exclude = [
  "Data/**",
  "Users/**",
  "Browser/Local Storage/**",
  "Browser/IndexedDB/**",
  "Browser/Session Storage/**",
]
evidence = "Chromium sub-caches, shader caches and downloaded components; offline audio under Data/ and per-user state under Users/ are excluded."
recoverable = true
keep_days = 0
requires = ["dir:{cache}/spotify"]
privilege = "user"

# The agent directories below are the only cache-shaped children of a directory
# that is mostly history. `~/.codex/packages` (downloaded release binaries) and
# `~/.claude/projects` (transcripts) are what make those directories large, and
# neither is a cache.
[[rule]]
id = "app.codex.cache"
section = "app-caches"
kind = "dir-sweep"
root = "{home}/.codex/cache"
evidence = "Cached app-server capabilities and the remote plugin catalog; fetched again on the next call."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.codex"]
privilege = "user"

[[rule]]
id = "app.claude.cache"
section = "app-caches"
kind = "dir-sweep"
root = "{home}/.claude/cache"
evidence = "The model catalog and a copy of the changelog; both are fetched again."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.claude"]
privilege = "user"

[[rule]]
id = "app.claude.shell-snapshots"
section = "app-caches"
kind = "dir-sweep"
root = "{home}/.claude/shell-snapshots"
evidence = "One shell environment snapshot per session; the next session writes its own."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.claude"]
privilege = "user"

[[rule]]
id = "app.opencode.cache"
section = "app-caches"
kind = "dir-sweep"
root = "{cache}/opencode"
evidence = "The model catalog under XDG_CACHE_HOME; fetched again on the next start."
recoverable = true
keep_days = 0
requires = ["dir:{cache}/opencode"]
privilege = "user"
