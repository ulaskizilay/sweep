# Large files - a report, not a sweep.
#
# A file over a gigabyte is not a cache. It might be a disk image the user forgot
# about, a video export, a virtual machine, or the only copy of something
# irreplaceable. Deleting by size alone is the classic way a disk cleaner loses a
# user's work, so this section reports and `sweep analyze` (M6) removes a chosen
# file through the trash.
#
# The rule is declared for `sweep rules list`, and disabled until the report
# exists in M5, because an unprompted walk of $HOME to depth 8 is slow enough to
# be mistaken for a hang.

[meta]
name = "large-files"
description = "Files over 1 GiB under $HOME, reported and never deleted by clean"

[[rule]]
id = "large.files.report"
section = "large-files"
kind = "report-only"
root = "{home}"
evidence = "Reported, never deleted: size is not evidence that a file is disposable."
keep_days = 30
privilege = "user"
max_depth = 8
enabled = false
