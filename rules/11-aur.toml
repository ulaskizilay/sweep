# AUR helper caches - the source of `sweep aur`.
#
# `paru`, `yay` and `trizen` keep one directory per package under `~/.cache`:
# a git clone of the AUR recipe, the sources `makepkg` downloaded, and the
# `.pkg.tar.*` archives `makepkg` built. Only the last of those is a target.
#
# The reason is the recipe. An AUR package is a `PKGBUILD` the user may have
# edited - a version bump, a dependency removed, a patch added - and that edit
# exists nowhere else. Deleting the clone deletes it. The built archive, by
# contrast, is output: `makepkg` reproduces it from the `PKGBUILD` that stays,
# and `paru`/`yay` will rebuild on the next upgrade. Keeping the sources is
# deliberate too: if upstream republished a tarball, the cached copy is the one
# whose checksum still matches, so removing it can make the package unbuildable
# until the recipe is updated by hand.
#
# So every helper gets two rules, not one:
#
#   * `*.pkg.tar.*` at depth 2 (`<cache>/<pkg>/<archive>`) is a file-pattern
#     with a one-week recency floor - an archive built minutes ago may be about
#     to be installed with `pacman -U`;
#   * the clone directory itself is report-only. The user is told how much is
#     there and why it was not taken, which is the honest answer to "why is this
#     still on my disk".
#
# The clone report measures the whole clone tree except the archives, and that
# exclusion is load-bearing twice. Without it the two rows count the same bytes:
# a clone holding 6 GiB of archives said "16.8 GiB measured, never deleted" and
# then deleted 7.3 GiB of it, so the sentence was false the moment it was read.
# Without the depth it only described the top two levels, leaving `src/` - the
# extracted copy of the tarball, several GiB on a package like `docker-desktop` -
# invisible. What the row means now is exactly what stays behind.
#
# This section belongs to `installer`'s sibling command `aur`: the walk is small
# but the confirmation has to explain git clones and recipes, and a bare
# `sweep clean` has no room for that. `Section::command()` keeps it out of
# `clean`, and `sweep clean --only aur` still works for a user who names it.

[meta]
name = "aur"
description = "Built package archives in AUR helper caches; clones and sources are reported only"

[[rule]]
id = "aur.paru.archives"
section = "aur"
kind = "file-pattern"
root = "{cache}/paru/clone"
pattern = "*.pkg.tar.*"
evidence = "makepkg reproduces the archive from the PKGBUILD that stays in the clone; the installed package and the AUR recipe are untouched."
recoverable = true
keep_days = 7
privilege = "user"
max_depth = 2

[[rule]]
id = "aur.paru.clones"
section = "aur"
kind = "report-only"
root = "{cache}/paru/clone"
evidence = "Reported, never deleted: a user-edited PKGBUILD exists only in this clone, and the downloaded source is the copy whose checksum still matches."
keep_days = 30
privilege = "user"
max_depth = 16
exclude = ["*.pkg.tar.*"]

[[rule]]
id = "aur.yay.archives"
section = "aur"
kind = "file-pattern"
root = "{cache}/yay"
pattern = "*.pkg.tar.*"
evidence = "makepkg reproduces the archive from the PKGBUILD that stays in the clone; the installed package and the AUR recipe are untouched."
recoverable = true
keep_days = 7
privilege = "user"
max_depth = 2

