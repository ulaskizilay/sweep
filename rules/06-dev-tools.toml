# Developer toolchain caches - the largest section, and the one that repays the
# most disk on a working machine.
#
# Three classes of target are deliberately separated, because "re-downloadable"
# and "recoverable" are not the same thing:
#
#   A. Fetchable from a public index - cargo `.crate` files, pip, uv, yarn,
#      pub.dev archives, ccache, nix-era build caches. Default: enabled, with a
#      retention window.
#
#   B. May need an account, a licence acceptance, or a network the machine does
#      not have - Hugging Face, PyTorch hub checkpoints. Default: disabled and
#      visible, never silently included.
#
#   C. A local repository whose only copy may be on this disk - Maven's
#      `~/.m2/repository`, Gradle's `modules-2`. Default: report-only, forever.
#
# A fourth class is absent on purpose: Docker, Podman and buildx are pruned by
# their own commands and their state is not a cache directory tree. They are
# reported in the virtualization section, not swept here.
#
# Every rule here deletes the path itself; sweep does not run a tool's own cache
# command (`go clean -cache`, `npm cache verify`). The roots below hold nothing
# but regenerable cache, so removing the directory is what the tool's command
# would have done, and no extra subprocess sits in the apply path.

[meta]
name = "dev-tools"
description = "Language and build toolchain caches: cargo, Go, npm, pip, uv, pub, JVM, ccache"

# Cargo's registry cache holds one `.crate` archive per published version.
# Deleting an archive does not touch `registry/src`, so a project that already
# built keeps its extracted sources; a rebuild re-downloads only what it needs.
[[rule]]
id = "dev.cargo.crate-cache"
section = "dev-tools"
kind = "file-pattern"
root = "{home}/.cargo/registry/cache"
pattern = "*.crate"
evidence = "Crate archives are re-downloadable from the registry; extracted sources under registry/src stay."
recoverable = true
keep_days = 30
privilege = "user"

[[rule]]
id = "dev.rustup.downloads"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.rustup/downloads"
evidence = "Partial toolchain downloads; rustup fetches a missing file again."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.rustup"]
privilege = "user"

[[rule]]
id = "dev.rustup.tmp"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.rustup/tmp"
evidence = "Extraction scratch space, empty between rustup runs."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.rustup"]
privilege = "user"

# The build cache is one directory that Go recreates; deleting the directory
# itself is what `go clean -cache` does.
[[rule]]
id = "dev.go.build-cache"
section = "dev-tools"
kind = "tool-cache"
root = "{cache}/go-build"
evidence = "Go's build cache; `go build` repopulates it and correctness never depends on it."
recoverable = true
keep_days = 0
requires = ["bin:go"]
privilege = "user"

[[rule]]
id = "dev.go.module-cache"
section = "dev-tools"
kind = "dir-age"
root = "{home}/go/pkg/mod/cache/download"
evidence = "Module zip and info files are re-downloaded from the proxy; extracted modules live under pkg/mod."
recoverable = true
keep_days = 30
requires = ["bin:go"]
privilege = "user"

# npm's cache is `$HOME/.npm` on every platform, not the XDG cache directory:
# `npm config get cache` answers `~/.npm` even when `XDG_CACHE_HOME` is set. This
# rule used to name `{cache}/npm/_cacache`, a path no Linux install creates, so
# it reported "path not present" on every run while 1.9 GiB of cacache sat one
# directory over. `_cacache` is the content-addressed store; `_logs`, `_npx` and
# the build directories beside it are not named here.
[[rule]]
id = "dev.npm.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.npm/_cacache"
evidence = "Content-addressed package cache; npm rebuilds the index on the next install."
recoverable = true
keep_days = 0
requires = ["bin:npm"]
privilege = "user"

[[rule]]
id = "dev.yarn.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/yarn"
evidence = "Yarn's package cache; a missing entry is fetched from the registry."
recoverable = true
keep_days = 0
requires = ["bin:yarn"]
privilege = "user"

# Yarn Berry keeps its own cache under `~/.yarn`, not the classic `~/.cache/yarn`
# location above. `berry/` also holds `global` (installed global packages) and
# `plugins`, so the rule names `berry/cache` and not the directory it lives in.
[[rule]]
id = "dev.yarn.berry-cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.yarn/berry/cache"
evidence = "Yarn Berry's downloaded package archives; `yarn install` fetches a missing entry again."
recoverable = true
keep_days = 0
requires = ["bin:yarn"]
privilege = "user"

[[rule]]
id = "dev.bun.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.bun/install/cache"
evidence = "Bun's install cache; `bun install` downloads what it needs again."
recoverable = true
keep_days = 0
requires = ["bin:bun"]
privilege = "user"

# Dart and Flutter keep one directory per downloaded package version under
# `hosted/pub.dev`. The rule names that host, not `hosted` and not the cache
# root: `hosted` can also hold a private pub server whose packages may need
# credentials to fetch again, and `~/.pub-cache` holds `global_packages`
# (activated executables) and `git` (pinned checkouts) beside the downloads.
# `dart pub get` fetches a missing version from the public index again.
[[rule]]
id = "dev.pub.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.pub-cache/hosted/pub.dev"
evidence = "Downloaded pub.dev package archives; `dart pub get` fetches a missing version again."
recoverable = true
keep_days = 0
requires = ["bin:dart"]
privilege = "user"

# pnpm's store is content-addressed and hardlinked into `node_modules`, so
# removing it frees the archive copies while every installed project keeps its
# files: the inode survives on the link count, not on the store directory. The
# next `pnpm install` re-links what it needs and re-downloads what it lost.
[[rule]]
id = "dev.pnpm.store"
section = "dev-tools"
kind = "dir-sweep"
root = "{data}/pnpm/store"
evidence = "Content-addressed package store; installed projects keep their hardlinks and pnpm fetches the rest."
recoverable = true
keep_days = 0
requires = ["dir:{data}/pnpm"]
privilege = "user"

# Corepack downloads one tarball per package-manager version and unpacks it on
# demand. This is not where the managers are installed, and `corepack enable`
# re-fetches a version that is missing.
[[rule]]
id = "dev.corepack.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/node/corepack"
evidence = "Downloaded package-manager tarballs; corepack fetches the version it needs again."
recoverable = true
keep_days = 0
requires = ["bin:corepack"]
privilege = "user"

[[rule]]
id = "dev.pip.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/pip"
evidence = "Downloaded wheels and sdists; pip fetches them from the index again."
recoverable = true
keep_days = 0
requires = ["bin:pip"]
privilege = "user"

[[rule]]
id = "dev.uv.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/uv"
# `archive-v0` unpacks each wheel into a directory tree, so the layout is as deep
# as the deepest package in the cache: 13 levels of directory and 14 of file on
# the machine this was measured on, against a default of 8. Everything below the
# default was blocked as too deep, and a parent holding a blocked child is not
# planned either, so a third of the cache could not be reached. Sixteen is
# headroom over the measured depth, not a layout guess.
max_depth = 16
evidence = "uv's wheel and source cache; `uv sync` re-resolves and re-downloads."
recoverable = true
keep_days = 0
requires = ["bin:uv"]
privilege = "user"

# `virtualenvs` is excluded by name. Recreating an environment is not a download
# but a full reinstall of every dependency, and it can fail when an index is
# unreachable - a different cost class from the wheel cache next to it.
[[rule]]
id = "dev.poetry.cache"
section = "dev-tools"
kind = "dir-age"
root = "{cache}/pypoetry"
exclude = ["virtualenvs", "virtualenvs/**"]
evidence = "Poetry's artifact cache is re-downloadable; the virtualenvs beside it are excluded."
recoverable = true
keep_days = 30
requires = ["bin:poetry"]
privilege = "user"

[[rule]]
id = "dev.pre-commit.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/pre-commit"
evidence = "Hook environments are rebuilt from the hook repositories on the next run."
recoverable = true
keep_days = 0
requires = ["bin:pre-commit"]
privilege = "user"

[[rule]]
id = "dev.ruff.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/ruff"
evidence = "Linter result cache, regenerated by the next run."
recoverable = true
keep_days = 0
requires = ["bin:ruff"]
privilege = "user"

[[rule]]
id = "dev.mypy.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/mypy"
evidence = "Type-checker cache, regenerated by the next run."
recoverable = true
keep_days = 0
requires = ["bin:mypy"]
privilege = "user"

[[rule]]
id = "dev.pytest.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/pytest"
evidence = "Last-failed and duration cache, regenerated by the next test run."
recoverable = true
keep_days = 0
requires = ["bin:pytest"]
privilege = "user"

# conda's package cache. One rule per install layout because a rule names one
# root, and a machine usually has exactly one of these. Deleting `pkgs` is what
# `conda clean --packages` does: environments hardlink their files out of it, so
# an installed environment keeps working, and `conda install` re-downloads what
# it needs. `conda clean` additionally prunes only the *unused* packages; sweep
# takes the whole cache because a rule cannot ask conda which ones are unused
# without running a subprocess in the apply path.
[[rule]]
id = "dev.conda.package-cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.conda/pkgs"
evidence = "conda's package cache; environments keep their hardlinks and conda re-downloads the rest."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.conda"]
privilege = "user"

[[rule]]
id = "dev.conda.anaconda-packages"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/anaconda3/pkgs"
evidence = "conda's package cache for an Anaconda install; environments keep their hardlinks."
recoverable = true
keep_days = 0
requires = ["dir:{home}/anaconda3"]
privilege = "user"

[[rule]]
id = "dev.conda.miniconda-packages"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/miniconda3/pkgs"
evidence = "conda's package cache for a Miniconda install; environments keep their hardlinks."
recoverable = true
keep_days = 0
requires = ["dir:{home}/miniconda3"]
privilege = "user"

[[rule]]
id = "dev.conda.miniforge-packages"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/miniforge3/pkgs"
evidence = "conda's package cache for a Miniforge install; environments keep their hardlinks."
recoverable = true
keep_days = 0
requires = ["dir:{home}/miniforge3"]
privilege = "user"

[[rule]]
id = "dev.conda.mambaforge-packages"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/mambaforge/pkgs"
evidence = "conda's package cache for a Mambaforge install; environments keep their hardlinks."
recoverable = true
keep_days = 0
requires = ["dir:{home}/mambaforge"]
privilege = "user"

# RubyGems caches the remote index and keeps the `.gem` archive of every gem it
# installed. The installed tree - `gems/`, `specifications/`, `bin/` - is the
# program and is never a target, which is why the archive rule is a
# `file-pattern` on `cache/` rather than a sweep of `{data}/gem`.
[[rule]]
id = "dev.gem.spec-cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.gem/specs"
evidence = "RubyGems' copy of the remote index; the next `gem` command fetches it again."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.gem"]
privilege = "user"

[[rule]]
id = "dev.gem.archives"
section = "dev-tools"
kind = "file-pattern"
root = "{data}/gem"
pattern = "ruby/*/cache/*.gem"
evidence = "The `.gem` archive behind an installed gem; the installed tree beside it stays."
recoverable = true
keep_days = 0
requires = ["dir:{data}/gem"]
privilege = "user"

# A git-sourced gem is checked out here and re-cloned by the next `bundle
# install`. Gems from rubygems.org are not cached in this directory.
[[rule]]
id = "dev.bundler.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.bundle/cache"
evidence = "Git-sourced gems are cloned again by `bundle install`."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.bundle"]
privilege = "user"

# `~/.rbenv/versions` holds the installed Rubies and is never a target; only the
# download and the extracted build tree are.
[[rule]]
id = "dev.rbenv.downloads"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.rbenv/cache"
evidence = "Ruby source tarballs kept until the version is built; `rbenv install` fetches them again."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.rbenv"]
privilege = "user"

[[rule]]
id = "dev.ruby-build.sources"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.rbenv/sources"
evidence = "Extracted Ruby sources kept as build directories; re-downloaded and re-extracted on the next install."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.rbenv"]
privilege = "user"

# Nix's per-user cache: the eval cache and the fetcher/binary-cache SQLite
# databases. `/nix/store` is deliberately absent - it is a protected root, and
# `nix-collect-garbage` decides what no GC root references. Sweeping it would
# delete store paths a running generation still needs.
[[rule]]
id = "dev.nix.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/nix"
evidence = "Evaluation and fetcher caches; nix re-evaluates and re-fetches on the next build."
recoverable = true
keep_days = 0
requires = ["bin:nix"]
privilege = "user"

# Class C: a private or `-SNAPSHOT` artifact may exist nowhere else.
[[rule]]
id = "dev.maven.repository"
section = "dev-tools"
kind = "report-only"
root = "{home}/.m2/repository"
evidence = "Reported, never deleted: a private or snapshot artifact may have no other copy."
keep_days = 30
privilege = "user"

# Class C for the same reason, even though many of these are public.
[[rule]]
id = "dev.gradle.modules"
section = "dev-tools"
kind = "report-only"
root = "{home}/.gradle/caches/modules-2"
evidence = "Reported, never deleted: private repositories are configured in the same store."
keep_days = 30
privilege = "user"

[[rule]]
id = "dev.coursier.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/coursier"
evidence = "Scala and sbt dependency cache; resolved again from the configured repositories."
recoverable = true
keep_days = 0
requires = ["dir:{cache}/coursier"]
privilege = "user"

[[rule]]
id = "dev.ccache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/ccache"
evidence = "Compiler output cache; a miss recompiles the translation unit."
recoverable = true
keep_days = 0
requires = ["bin:ccache"]
privilege = "user"

[[rule]]
id = "dev.sccache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/sccache"
evidence = "Shared compilation cache; a miss recompiles the translation unit."
recoverable = true
keep_days = 0
requires = ["bin:sccache"]
privilege = "user"

# Model weights are not here. `~/.cache/huggingface/hub`, `~/.cache/torch` and
# `~/.cache/whisper` were report-only placeholders until M3b; they now live in
# the opt-in `model-caches` section, which has a handler for the hub's
# blob/snapshot symlink layout. Two rules on one root, with two retention
# policies, is how a sweep ends up disagreeing with itself.

# Downloaded browser and test-runner binaries are reported, never deleted. They
# are fetched, not rebuilt: removing one costs a multi-hundred-megabyte download
# and breaks the next test run until it finishes, and a `dir-sweep` with
# `keep_days = 0` removed them on every `clean` - including one run minutes
# after the user last used them, because a browser binary is read, never
# rewritten, so its mtime says nothing about use. The same category
# (`ms-playwright`, `google-chrome-for-testing-headless`) is on
# `user.cache.residual`'s exclude list because it has no rule of its own; these
# two do not need an entry there, since the blanket sweep keeps away from every
# root the catalog names, whatever the kind.
[[rule]]
id = "dev.puppeteer.cache"
section = "dev-tools"
kind = "report-only"
root = "{cache}/puppeteer"
evidence = "Downloaded browser revisions. Reported, never deleted: `npx puppeteer browsers install` fetches them again, and a re-download is a cost rather than a rebuild."
recoverable = true
keep_days = 30
requires = ["dir:{cache}/puppeteer"]
privilege = "user"

[[rule]]
id = "dev.cypress.cache"
section = "dev-tools"
kind = "report-only"
root = "{cache}/Cypress"
evidence = "Downloaded test-runner binary. Reported, never deleted: reinstalling it is a download, and the directory cannot tell a build in use from an abandoned one."
recoverable = true
keep_days = 30
requires = ["dir:{cache}/Cypress"]
privilege = "user"

# The JetBrains system directory is ~/.cache/JetBrains/<product><version> on
# Linux. Almost all of it is rebuilt on the next project open: indexes, caches,
# logs.
#
# One child is not. `LocalHistory/` is the IDE's own revision store for work that
# was never committed - the user's unsaved change history - and no rebuild brings
# it back. It is excluded by name. The `**` is defensive: the product directory
# is one level deep today, and a deeper layout should not be what makes the
# exclude stop matching. The IDE configuration and plugins live under ~/.config
# and are not touched either.
#
# Android Studio uses the same layout under a different root,
# ~/.cache/Google/AndroidStudio<version>. The version is part of the directory
# name, so the rule below matches it with a pattern rather than naming one
# version; the rest of ~/.cache/Google is not touched. Settings, plugins and the
# SDK live under ~/.config/Google and ~/Android, and no project data is here.
[[rule]]
id = "dev.jetbrains.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/JetBrains"
exclude = ["**/LocalHistory"]
evidence = "Indexes, caches and logs are rebuilt from the project; the LocalHistory revision store beside them is excluded because nothing rebuilds it."
recoverable = true
keep_days = 0
requires = ["dir:{cache}/JetBrains"]
privilege = "user"

[[rule]]
id = "dev.android-studio.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/Google/AndroidStudio*"
evidence = "Per-version IDE indexes, caches and logs; Android Studio rebuilds them on the next open, and projects, settings and the SDK live elsewhere."
recoverable = true
keep_days = 0
privilege = "user"

# Neovim state (shada, swap, undo) lives in ~/.local/state/nvim, which is not a
# rule and is protected as user state.
[[rule]]
id = "dev.nvim.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/nvim"
evidence = "Telescope and LSP caches are rebuilt; editor state lives under ~/.local/state."
recoverable = true
keep_days = 0
requires = ["dir:{cache}/nvim"]
privilege = "user"

[[rule]]
id = "dev.gh.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/gh"
evidence = "Cached API responses and release metadata; fetched again on the next call."
recoverable = true
keep_days = 0
requires = ["bin:gh"]
privilege = "user"

[[rule]]
id = "dev.mise.cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{cache}/mise"
evidence = "Tool version manager cache; a missing entry is fetched again."
recoverable = true
keep_days = 0
requires = ["bin:mise"]
privilege = "user"

[[rule]]
id = "dev.asdf.downloads"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.asdf/downloads"
evidence = "Source archives kept only until the tool version is built."
recoverable = true
keep_days = 0
requires = ["bin:asdf"]
privilege = "user"

# buildx state includes builder instances and nodes, not only cache, so this is a
# report rather than a sweep. `docker buildx prune` owns the decision.
[[rule]]
id = "dev.docker.buildx"
section = "dev-tools"
kind = "report-only"
root = "{home}/.docker/buildx"
evidence = "Reported, never deleted: the directory holds builder state, not only cache."
keep_days = 30
privilege = "user"

# Android is the section's largest apparent gap and its smallest real one. The
# SDK is a toolchain, not a cache: `platforms`, `build-tools`, `ndk` and
# `system-images` are installed components a pinned build or an existing AVD
# refers to by name, and removing the wrong version breaks both. The AVDs are
# worse: `userdata-qemu.img.qcow2` is the emulator's data partition, which is the
# only copy of whatever was installed in it. Measured on this machine, 11 GiB
# across the SDK and the AVDs, of which the two rules below are 7 MiB.
#
# What *is* a cache is the sdkmanager repository index and the partial component
# downloads, and both come back on the next `sdkmanager` run.
[[rule]]
id = "dev.android.sdk-index-cache"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/.android/cache"
evidence = "sdkmanager's copy of the repository index; fetched again on the next package query."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.android"]
privilege = "user"

[[rule]]
id = "dev.android.sdk-partial-downloads"
section = "dev-tools"
kind = "dir-sweep"
root = "{home}/Android/Sdk/.temp"
evidence = "Component downloads that never finished; `sdkmanager` starts them again."
recoverable = true
keep_days = 0
requires = ["dir:{home}/Android/Sdk"]
privilege = "user"

# Two tools install every release beside the last one and leave a launcher
# symlink pointing at the release in use: `claude` writes one executable per
# version, `cursor-agent` writes a whole tree per build. The old entries are not
# caches - nothing rebuilds them - but they are complete copies of the program,
# so they are large: 331-340 MiB per `claude` release and 556-558 MiB per
# `cursor-agent` build on this machine, three of each.
#
# `kind = "versions"` keeps the newest entry and the one the launcher resolves
# to, and plans nothing at all when the launcher is missing, is not a symlink,
# dangles, or points outside the directory. "Newest" is a guess about which
# release is live; the link is the statement, and a pinned or half-updated
# launcher must not lose the working binary.
[[rule]]
id = "dev.claude.versions"
section = "dev-tools"
kind = "versions"
root = "{home}/.local/share/claude/versions"
keep_versions = 1
keep_link = "{home}/.local/bin/claude"
evidence = "Each entry is one complete release; the launcher names the release in use and the updater writes a new entry instead of editing one, so only an older copy of the same program is removed."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.local/share/claude/versions"]
privilege = "user"

[[rule]]
id = "dev.cursor-agent.versions"
section = "dev-tools"
kind = "versions"
root = "{home}/.local/share/cursor-agent/versions"
keep_versions = 1
keep_link = "{home}/.local/bin/cursor-agent"
evidence = "Each entry is one complete build of the agent; the launcher names the build in use and the updater writes a new tree instead of editing one, so only an older copy of the same program is removed."
recoverable = true
keep_days = 0
requires = ["dir:{home}/.local/share/cursor-agent/versions"]
privilege = "user"

# The standalone `codex` installer has the same shape one directory up: every
# release is a tree under `releases/` and `current` names the one in use. The
# tree holds its own link (`<release>/codex` points at the real binary), which is
# why the kind removes a release whole rather than file by file. 324 MiB for
# 0.154.0 and 427 MiB for 0.160.0 on this machine. `keep_days = 7` is the one
# rule here with a floor, because the CLI updates itself: a downgrade that has
# unpacked an older release but not yet moved `current` is not the newest, and
# the floor is what keeps it until the link catches up.
[[rule]]
id = "dev.codex.versions"
section = "dev-tools"
kind = "versions"
root = "{home}/.codex/packages/standalone/releases"
