# Desktop applications whose caches are large enough to be worth a rule of their
# own.
#
# Steam is the interesting case: `shadercache` and `appcache` are regenerated by
# the client, `depotcache` holds manifests that are cheap to fetch again, but
# `steamapps/common` is the installed games and is not a cache at all. Each rule
# names one of the first three.
#
# Screenshot and recording directories are never rules: they are user output.

[meta]
name = "apps"
description = "Steam, game launchers, media players, creative tools and OBS logs"

[[rule]]
id = "app.steam.shadercache"
section = "apps"
kind = "dir-sweep"
root = "{data}/Steam/steamapps/shadercache"
evidence = "Compiled shaders are regenerated the first time a game renders again."
recoverable = true
keep_days = 0
requires = ["dir:{data}/Steam"]
privilege = "user"

[[rule]]
id = "app.steam.appcache"
section = "apps"
kind = "dir-sweep"
root = "{data}/Steam/appcache"
evidence = "The client's HTTP and image cache; refetched from Steam."
recoverable = true
keep_days = 0
requires = ["dir:{data}/Steam"]
privilege = "user"

[[rule]]
id = "app.steam.depotcache"
section = "apps"
kind = "dir-sweep"
root = "{data}/Steam/depotcache"
evidence = "Depot manifests are downloaded again when the client next verifies a game."
recoverable = true
keep_days = 0
requires = ["dir:{data}/Steam"]
privilege = "user"

# Lutris's cache root is a mixed bag, and the names in it are the app's, not a
# convention: `settings.CACHE_DIR` holds the artwork, the shader cache, the
# downloaded installers, `versions.json` - and `.gog.token`, `.egs.token`,
# `gog-library.json`, `egs-library.json` plus one `<save>.json` per save-synced
# game, written at the root with names this catalog cannot predict.
#
# So the rule names the one child that is only a download. Taking the root would
# log the user out of GOG and Epic and drop the save-sync state, which is why the
# scope stops at `installer/`.
[[rule]]
id = "app.lutris.cache"
section = "apps"
kind = "dir-sweep"
root = "{cache}/lutris/installer"
evidence = "Downloaded game installers, fetched again by the installer; the GOG/Epic tokens and save-sync state in the parent are left alone."
recoverable = true
keep_days = 0
requires = ["bin:lutris"]
privilege = "user"

[[rule]]
id = "app.heroic.cache"
section = "apps"
kind = "dir-sweep"
root = "{cache}/heroic"
evidence = "Epic and GOG store metadata cache, refetched by the launcher."
recoverable = true
keep_days = 0
requires = ["dir:{cache}/heroic"]
privilege = "user"

[[rule]]
id = "app.vlc.cache"
section = "apps"
kind = "dir-sweep"
root = "{cache}/vlc"
evidence = "The media player's plugin and artwork cache; rebuilt on the next launch."
recoverable = true
keep_days = 0
requires = ["bin:vlc"]
privilege = "user"

[[rule]]
id = "app.mpv.cache"
section = "apps"
kind = "dir-sweep"
root = "{cache}/mpv"
evidence = "Shader and watch-later caches outside the config directory."
recoverable = true
keep_days = 0
requires = ["bin:mpv"]
privilege = "user"

[[rule]]
id = "app.gimp.cache"
section = "apps"
kind = "dir-sweep"
root = "{cache}/gimp"
evidence = "Brush and plug-in caches; rebuilt when GIMP next starts."
recoverable = true
keep_days = 0
requires = ["bin:gimp"]
privilege = "user"

[[rule]]
id = "app.krita.cache"
section = "apps"
kind = "dir-sweep"
root = "{cache}/krita"
evidence = "Resource and preview caches; rebuilt from the resource libraries."
recoverable = true
keep_days = 0
requires = ["bin:krita"]
privilege = "user"

[[rule]]
id = "app.inkscape.cache"
section = "apps"
kind = "dir-sweep"
root = "{cache}/inkscape"
evidence = "Extension and font caches; rebuilt on the next start."
recoverable = true
keep_days = 0
requires = ["bin:inkscape"]
privilege = "user"

# OBS writes one log per launch. A week is long enough to paste the last crash
# into a bug report and short enough to stop the directory growing forever.
[[rule]]
id = "app.obs.logs"
section = "apps"
kind = "dir-age"
root = "{config}/obs-studio/logs"
evidence = "Per-launch diagnostic logs; the current session's log is inside the window."
recoverable = true
keep_days = 7
requires = ["dir:{config}/obs-studio"]
privilege = "user"
