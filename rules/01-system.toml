# System caches that live outside the home directory.
#
# These run through the privilege boundary: `clean` plans them in the user
# process (reading a cache needs no privilege), asks separately before
# elevating, and then the same binary re-executes itself through `run0` or
# `sudo` with the plan on stdin. The child re-derives this list from the
# compiled catalog and refuses any rule id that is not on it, so a user overlay
# cannot widen root deletion.
#
# The package cache is `pkg-cache`, not `dir-age`: it keeps the newest N
# versions of each package because the newest archive is the one that matters,
# whatever its date. An age cut-off would delete the only copy of the running
# kernel's package on a machine that has not been upgraded in months, which is
# exactly when a rollback is the thing you want. `keep_days` is a second floor on
# top of the count: a version downloaded yesterday is a downgrade in progress.
#
# Rotated logs are `file-pattern` with a depth of one, because `/var/log` is
# shared with services that reopen their files on SIGHUP rather than on demand.
# The rule names the rotated shapes only, and the live files - `pacman.log`, the
# journal - are excluded by name.
#
# What is still disabled, and why:
#
#   * The report-only rules stay off: reading a path needs no privilege, so they
#     could run, but a `clean` that walks `/var/lib/systemd/coredump` without
#     explaining the result is noise.

[meta]
name = "system"
description = "Package, font, man page, firmware and log caches outside $HOME"

# `keep_versions = 2` matches what `paccache -k 2` keeps: the installed version
# and the one before it, which is the rollback a user actually performs. The
# archive's detached `.sig` is part of the same generation, so it is never a
# version slot of its own.
[[rule]]
id = "system.pacman.package-cache"
section = "system"
kind = "pkg-cache"
root = "/var/cache/pacman/pkg"
evidence = "Package archives are re-downloadable from a mirror; the installed database lives in /var/lib/pacman."
recoverable = true
keep_versions = 2
keep_days = 7
privilege = "root"
enabled = true

[[rule]]
id = "system.fontconfig.cache"
section = "system"
kind = "dir-sweep"
root = "/var/cache/fontconfig"
evidence = "Fontconfig rebuilds its index on the next font query."
recoverable = true
keep_days = 0
privilege = "root"
enabled = true

# `/var/cache/ldconfig` is mode 0700 root on a default install, so the user
# process cannot read it at all. Enabling it would only ever print `permission
# denied`: planning happens as the user, and a cache that is invisible before
# the password prompt cannot be shown in the plan the password confirms.
# `aux-cache` is a few hundred kilobytes anyway; read it as root by hand if it
# ever matters.
[[rule]]
id = "system.ldconfig.cache"
section = "system"
kind = "dir-sweep"
root = "/var/cache/ldconfig"
evidence = "The dynamic linker cache is regenerated by ldconfig."
recoverable = true
keep_days = 0
privilege = "root"
enabled = false

[[rule]]
id = "system.man.cache"
section = "system"
kind = "dir-sweep"
root = "/var/cache/man"
evidence = "Formatted man pages are rebuilt from the source pages in /usr/share/man."
recoverable = true
keep_days = 0
privilege = "root"
enabled = true

[[rule]]
id = "system.fwupd.cache"
section = "system"
kind = "dir-age"
root = "/var/cache/fwupd"
evidence = "Firmware metadata and downloaded payloads are fetched again from the LVFS."
recoverable = true
keep_days = 30
privilege = "root"
enabled = true

# `journalctl --vacuum-time` owns journald's rotation. sweep reads the size and
# never deletes: a journal file removed behind journald's back leaves the index
# inconsistent.
[[rule]]
id = "system.journal.report"
section = "system"
kind = "report-only"
root = "/var/log/journal"
evidence = "Reported, never deleted: journald rotates these files itself."
keep_days = 7
privilege = "root"
enabled = false

[[rule]]
id = "system.coredump.report"
section = "system"
kind = "report-only"
root = "/var/lib/systemd/coredump"
evidence = "Reported, never deleted: coredumpctl owns these files and /var/lib is protected."
keep_days = 7
privilege = "root"
enabled = false

# Rotated logs only, one level below /var/log. `*.log.*` covers both the plain
# `boot.log.1` that systemd rotates and the compressed `boot.log.1.gz`, while
# leaving `Xorg.0.log` alone - a live log has no second dot. `pacman.log*` is the
# package manager's audit trail, not a log to rotate away, and it is excluded
# including its own rotations.
[[rule]]
id = "system.log.rotated"
section = "system"
kind = "file-pattern"
root = "/var/log"
pattern = ["*.gz", "*.xz", "*.zst", "*.old", "*.log.*"]
exclude = ["journal", "journal/**", "pacman.log*"]
evidence = "A rotated log has already been replaced by a fresh one; the live files are untouched."
recoverable = true
keep_days = 7
privilege = "root"
max_depth = 1
enabled = true
