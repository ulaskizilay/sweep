# System caches that live outside the home directory.
#
# Every rule here is disabled. Two things are missing on purpose:
#
#   * the privilege boundary (M4) - sweep runs as the user and refuses
#     root-owned files, so these roots would produce a screen of
#     `foreign_owner` refusals rather than a preview;
#   * `paccache` semantics (M4) - the package cache keeps the last N versions
#     of each package, not "everything older than N days". An age cut-off is a
#     proxy that can delete the only copy of the running kernel's package.
#
# Reporting is different: reading a path needs no privilege, so the report-only
# rules below could run today. They stay disabled until the section has a
# report of its own, because a `clean` that walks `/var/lib/systemd/coredump`
# without explaining the result is noise.

[meta]
name = "system"
description = "Package, font, man page, firmware and log caches outside $HOME"

[[rule]]
id = "system.pacman.package-cache"
section = "system"
kind = "dir-age"
root = "/var/cache/pacman/pkg"
evidence = "Package archives are re-downloadable from a mirror; the installed database lives in /var/lib/pacman."
recoverable = true
keep_days = 30
privilege = "root"
enabled = false

[[rule]]
id = "system.fontconfig.cache"
section = "system"
kind = "dir-sweep"
root = "/var/cache/fontconfig"
evidence = "Fontconfig rebuilds its index on the next font query."
recoverable = true
keep_days = 0
privilege = "root"
enabled = false

[[rule]]
id = "system.ldconfig.cache"
section = "system"
kind = "dir-sweep"
root = "/var/cache/ldconfig"
evidence = "The dynamic linker cache is regenerated by ldconfig."
recoverable = true
keep_days = 0
privilege = "root"
enabled = false

[[rule]]
id = "system.man.cache"
section = "system"
kind = "dir-sweep"
root = "/var/cache/man"
evidence = "Formatted man pages are rebuilt from the source pages in /usr/share/man."
recoverable = true
keep_days = 0
privilege = "root"
enabled = false

[[rule]]
id = "system.fwupd.cache"
section = "system"
kind = "dir-age"
root = "/var/cache/fwupd"
evidence = "Firmware metadata and downloaded payloads are fetched again from the LVFS."
recoverable = true
keep_days = 30
privilege = "root"
enabled = false

# `journalctl --vacuum-time` owns journald's rotation. sweep reads the size and
# never deletes: a journal file removed behind journald's back leaves the index
# inconsistent.
[[rule]]
id = "system.journal.report"
section = "system"
kind = "report-only"
root = "/var/log/journal"
evidence = "Reported, never deleted: journald rotates these files itself."
keep_days = 7
privilege = "root"
enabled = false

[[rule]]
id = "system.coredump.report"
section = "system"
kind = "report-only"
root = "/var/lib/systemd/coredump"
evidence = "Reported, never deleted: coredumpctl owns these files and /var/lib is protected."
keep_days = 7
privilege = "root"
enabled = false

# Rotated logs only: `*.gz`, `*.xz`, `*.old` one level below /var/log. The
# journal directory is pruned by name, and pacman.log is the package manager's
# audit trail rather than a log to rotate away.
[[rule]]
id = "system.log.rotated"
section = "system"
kind = "file-pattern"
root = "/var/log"
pattern = ["*.gz", "*.xz", "*.old"]
exclude = ["journal", "journal/**", "pacman.log"]
evidence = "A rotated log has already been replaced by a fresh one; the live files are untouched."
recoverable = true
keep_days = 7
privilege = "root"
max_depth = 1
enabled = false
