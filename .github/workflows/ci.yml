name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install base packages
        run: pacman -Sy --noconfirm --needed base-devel git rustup

      - uses: actions/checkout@v4

      - name: Install stable with rustfmt and clippy
        env:
          RUSTUP_HOME: /opt/rustup
          CARGO_HOME: /opt/cargo
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Make the toolchain usable by the whole job
        run: |
          ln -sf /opt/cargo/bin/* /usr/local/bin/
          cargo --version

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  # The plan gates M0 on "cargo deny temiz", so the check lives in CI rather
  # than in a README line nobody runs.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The full suite must run as an ordinary user: the kernel refuses to run as
  # root by design, and `gather_reports_the_real_machine` asserts it. Running
  # these as root would make that assertion meaningless.
  test:
    name: test (unprivileged)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install base packages
        run: pacman -Sy --noconfirm --needed base-devel git rustup

      - uses: actions/checkout@v4

      - name: Install stable into a shared location
        env:
          RUSTUP_HOME: /opt/rustup
          CARGO_HOME: /opt/cargo
        run: |
          # The components are named here because `rust-toolchain.toml` names
          # them: a pin beats `--profile minimal`, so rustup tries to add the
          # missing ones the first time the test user runs `cargo`, and the
          # toolchain is read-only for that user.
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          # The registry and the toolchain are read-only for the test user; only
          # the workspace needs to be writable. `cargo` has not run yet, so
          # `CARGO_HOME` does not exist until it is created here.
          mkdir -p /opt/cargo/registry
          chmod -R a+rX /opt/rustup /opt/cargo
          chown -R 1000:1000 /opt/cargo/registry
          ln -sf /opt/cargo/bin/* /usr/local/bin/

      - name: Create a test user that owns the workspace
        run: |
          useradd --uid 1000 --create-home --shell /bin/bash tester
          # Only the workspace, not all of `/__w`: that tree is the runner's own
          # scratch space (`/home/runner/work`), and handing it to another user
          # makes the runner unable to read its own step files.
          chown -R tester "$GITHUB_WORKSPACE"

      - name: Tests
        env:
          RUSTUP_HOME: /opt/rustup
          CARGO_HOME: /opt/cargo
        run: su tester -c 'cargo test --workspace --all-targets'

      - name: Longer property run
        env:
          RUSTUP_HOME: /opt/rustup
          CARGO_HOME: /opt/cargo
          PROPTEST_CASES: 2048
        run: su tester -c 'cargo test --release -p sweep-core --test properties'

  # The job that catches "green on ext4, wrong on btrfs". `TMPDIR` is pointed at
  # the btrfs mount so every tempdir-based test — the honest filesystem ones, not
  # the in-memory doubles — actually runs on btrfs.
  btrfs:
    name: test (btrfs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a btrfs filesystem in a sparse file
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs
          truncate -s 1G /tmp/btrfs.img
          sudo mkfs.btrfs -q /tmp/btrfs.img
          sudo mkdir -p /mnt/btrfs
          sudo mount -o loop /tmp/btrfs.img /mnt/btrfs
          sudo chown -R "$USER" /mnt/btrfs
          # After the mount, not before: a directory made on the underlying
          # filesystem is hidden by the mount, and `TMPDIR` then names a path
          # that does not exist.
          mkdir -p /mnt/btrfs/tmp
          btrfs subvolume create /mnt/btrfs/@snapshots
          mkdir -p /mnt/btrfs/@snapshots/1/snapshot/cache

      - name: Toolchain
        run: |
          # Same reason as the unprivileged job: the pin in
          # `rust-toolchain.toml` asks for these two components, and installing
          # them here keeps the first `cargo` call from doing it implicitly.
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Tests, with temporary directories on btrfs
        env:
          TMPDIR: /mnt/btrfs/tmp
        run: |
          cargo build --workspace
          cargo test --workspace --all-targets

      - name: btrfs is measured, not assumed
        run: |
          ./target/debug/sweep doctor --json > /tmp/doctor.json
          python3 - <<'PY'
          import json, sys

          report = json.load(open('/tmp/doctor.json'))
          mount = next(
              (m for m in report['mounts'] if m['mount_point'] == '/mnt/btrfs'),
              None,
          )
          assert mount is not None, [m['mount_point'] for m in report['mounts']]
          assert mount['fstype'] == 'btrfs', mount
          assert mount['cow'] is True, mount
          assert '/mnt/btrfs/@snapshots' in mount['snapshots'], mount

          # The snapshot directory must be attributed to this mount and no other.
          others = [
              m['mount_point'] for m in report['mounts']
              if m['mount_point'] != '/mnt/btrfs'
              and any(s.startswith('/mnt/btrfs') for s in m['snapshots'])
          ]
          assert not others, others
          print('btrfs facts correct')
          PY

      - name: Unmount
        if: always()
        run: |
          sudo umount /mnt/btrfs || true
          rm -f /tmp/btrfs.img

  # Both `packaging/*/PKGBUILD` files list aarch64, and until this job existed
  # every gate compiled x86_64 only, so the second architecture was a claim with
  # nothing behind it. Three steps answer three different questions: `check`
  # proves the aarch64 `cfg` branches type-check, the linked build proves a GNU
  # arm64 toolchain can produce the binary, and running it under qemu proves the
  # result starts instead of dying in a bad relocation.
  aarch64:
    name: build (aarch64)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install base packages
        run: >-
          pacman -Sy --noconfirm --needed
          base-devel git rustup file qemu-user
          aarch64-linux-gnu-gcc aarch64-linux-gnu-glibc

      - uses: actions/checkout@v4

      - name: Install stable and the target
        env:
          RUSTUP_HOME: /opt/rustup
          CARGO_HOME: /opt/cargo
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu
          ln -sf /opt/cargo/bin/* /usr/local/bin/

      - name: Type-check every target of the workspace for aarch64
        env:
          RUSTUP_HOME: /opt/rustup
          CARGO_HOME: /opt/cargo
        run: cargo check --workspace --all-targets --target aarch64-unknown-linux-gnu

      - name: Cross-build the binary
        env:
          RUSTUP_HOME: /opt/rustup
          CARGO_HOME: /opt/cargo
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --workspace --target aarch64-unknown-linux-gnu

      - name: The artifact really is an arm64 binary
        run: |
          file target/aarch64-unknown-linux-gnu/debug/sweep | tee /tmp/artifact
          grep -q 'ARM aarch64' /tmp/artifact

      - name: The arm64 binary starts under qemu
        run: |
          qemu-aarch64 -L /usr/aarch64-linux-gnu \
            ./target/aarch64-unknown-linux-gnu/debug/sweep --version

  # libFuzzer needs nightly, so it stays out of the merge gate: a flaky runner
  # must not block a pull request. It still runs per push.
  #
  # Every `cargo fuzz` call names `+nightly` on the command line:
  # `rust-toolchain.toml` pins stable, and a pin beats `rustup default`, so a
  # bare `cargo fuzz` runs the stable compiler and dies on `-Zsanitizer`.
  #
  # `--target` names the host triple because cargo-fuzz defaults to musl on
  # Linux, and ASAN refuses a statically linked libc. The host triple's `std`
  # comes with the toolchain, so nothing else has to be installed.
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: fuzz_validate
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_validate -- -max_total_time=60

      - name: fuzz_oplog_escape
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_oplog_escape -- -max_total_time=60

      - name: fuzz_rule_toml
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_rule_toml -- -max_total_time=60

  # A broken relative link in README/SAFETY is the first sign of a stale claim.
  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every relative markdown link resolves
        run: python3 scripts/check_links.py
      - name: Maintainer scripts compile
        run: python3 -m py_compile scripts/check_links.py scripts/probe_orphan_data.py
