[workspace]
resolver = "2"
members = ["crates/sweep-core", "crates/sweep-cli", "crates/sweep-testkit"]
# `fuzz` is its own package: it needs the nightly-only sanitizer flags that
# cargo-fuzz injects, so it must not be pulled into the stable workspace build.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
clap_mangen = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
